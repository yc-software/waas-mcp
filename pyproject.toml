[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "waas-mcp"
version = "0.1.0"
description = "MCP server for YC Work at a Startup (WAAS) API"
requires-python = ">=3.10"
dependencies = [
    # mcp 2.0 removed the low-level Server decorator API (@server.list_tools())
    # that server.py is built on. Pin below 2 until the server is ported.
    "mcp>=1.27,<2",
    "requests",
    "python-dotenv",
]

[project.scripts]
waas = "src.waas:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]
